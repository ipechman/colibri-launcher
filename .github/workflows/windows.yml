name: Windows launcher

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      COLIBRI_TEST_ROOT: ${{ github.workspace }}\.upstream
    steps:
      - uses: actions/checkout@v4
      - name: Check out the separate Colibri compatibility fixture
        uses: actions/checkout@v4
        with:
          repository: JustVugg/colibri
          # v1.11.0; keep engine code outside the launcher package.
          ref: 3a70acbf6e7054f6edcf4b7d3b1e679793eb8e48
          path: .upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install the launcher and build tools
        run: python -m pip install -e ".[build]"
      - name: Run launcher and process supervisor tests
        run: python -m unittest discover -s tests/launcher -v
      - name: Build wheel and source distribution
        run: python -m build
      - name: Build native package and checksum
        run: python packaging/build_windows.py
      - name: Extract and smoke-test the distribution ZIP
        shell: pwsh
        run: |
          $launcherArchive = Get-Item dist/ColibriLauncher-*-Windows-x64.zip
          Expand-Archive -LiteralPath $launcherArchive.FullName -DestinationPath build/archive-check
          python tests/launcher/packaged_smoke.py build/archive-check/ColibriLauncher/ColibriLauncher.exe .upstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expectedHash = (Get-Content -LiteralPath "$($launcherArchive.FullName).sha256").Split(' ')[0]
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $launcherArchive.FullName).Hash
          if ($actualHash -ne $expectedHash) { throw 'Distribution checksum mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: ColibriLauncher-Windows-x64
          if-no-files-found: error
          path: |
            dist/ColibriLauncher-*-Windows-x64.zip
            dist/ColibriLauncher-*-Windows-x64.zip.sha256
